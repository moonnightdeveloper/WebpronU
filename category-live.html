<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Shows Category - WebpronU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <!-- Same as index.html -->
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Category Header -->
        <section class="hero-section" style="min-height: 40vh; padding-top: 120px;">
            <div class="hero-overlay"></div>
            <div class="container">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1 class="hero-title">
                            <span class="title-line">Live</span>
                            <span class="title-line highlight">Shows</span>
                        </h1>
                        <p class="hero-subtitle">
                            Real-time interactive entertainment
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Live Categories -->
        <section class="section">
            <div class="container">
                <div class="categories-grid">
                    <a href="live-private.html" class="category-card">
                        <div class="category-icon">
                            <i class="fas fa-user-secret"></i>
                        </div>
                        <h3>Private Shows</h3>
                        <p>One-on-one sessions</p>
                        <span class="category-count">200+</span>
                    </a>
                    
                    <a href="live-group.html" class="category-card">
                        <div class="category-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <h3>Group Shows</h3>
                        <p>Interactive group sessions</p>
                        <span class="category-count">150+</span>
                    </a>
                    
                    <a href="live-cam.html" class="category-card">
                        <div class="category-icon">
                            <i class="fas fa-webcam"></i>
                        </div>
                        <h3>Webcam</h3>
                        <p>Direct webcam streaming</p>
                        <span class="category-count">300+</span>
                    </a>
                    
                    <a href="live-themed.html" class="category-card">
                        <div class="category-icon">
                            <i class="fas fa-mask"></i>
                        </div>
                        <h3>Themed Shows</h3>
                        <p>Special theme events</p>
                        <span class="category-count">100+</span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Live Content Grid -->
        <section class="section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">
                        <i class="fas fa-fire"></i>
                        Live Now
                    </h2>
                </div>
                
                <div class="models-grid">
                    <!-- Live content cards similar to live.html -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <!-- Same as index.html -->
    </footer>
</body>
</html>
